# Agent status: one "window glyph+session glyph+session" group per window with
# panes whose @agent_state is set by agent-state.sh (Claude Code hooks, opencode
# plugin). Panes back at a shell prompt are skipped, so an agent that exited
# without cleaning up disappears.
# Colours are rose-pine; style blocks must not contain commas.

%hidden AGENT_WORKING="#[fg=#f6c177 bold]●#[nobold]"
%hidden AGENT_WAITING="#[fg=#eb6f92 bold]!#[nobold]"
%hidden AGENT_DONE="#[fg=#9ccfd8 bold]✓#[nobold]"
%hidden AGENT_IDLE="#[fg=#908caa]○"

# The session name comes from the terminal title the agent sets ("✳ name" for
# Claude Code, "OC | name" for opencode); before a session is named (or if the
# agent still has its default title), show its canonical kind like Herdr does.
# The pane number pN remains the last resort when no agent identity is available.
%hidden AGENT_TITLE="#{s/^(OC [|] |[^A-Za-z0-9 ]+ )//:pane_title}"
%hidden AGENT_DEFAULT_LABEL="#{s/^Claude Code$/claude/:#{s/^OpenCode$/opencode/:$AGENT_TITLE}}"
%hidden AGENT_LABEL="#{?#{||:#{==:,$AGENT_DEFAULT_LABEL},#{==:#{pane_title},#{host}}},p#{pane_index},$AGENT_DEFAULT_LABEL}"
%hidden AGENT_VISIBLE="#{?#{@agent_state},#{?#{m:*sh,#{pane_current_command}},,1},}"

# Keep full titles in tmux and truncate only while rendering. The budget adapts
# to both client width and the number of visible agents, using roughly half of
# the bar at each tier while allowing longer names when there is room.
%hidden AGENT_COUNT="#{n:#{W:#{P:$AGENT_VISIBLE}}}"
set -F @agent_count "$AGENT_COUNT"
%hidden AGENT_LABEL_24="#{=/24/…:$AGENT_LABEL}"
%hidden AGENT_LABEL_16="#{=/16/…:$AGENT_LABEL}"
%hidden AGENT_LABEL_12="#{=/12/…:$AGENT_LABEL}"
%hidden AGENT_LABEL_8="#{=/8/…:$AGENT_LABEL}"
%hidden AGENT_BAR_WIDTH="#{?#{client_width},#{client_width},#{window_width}}"

# Icons lead each entry for quick scanning. Window names are bold iris, all
# agent names use the high-contrast text colour, and the selected one is bold.
%hidden AGENT_WINDOW="#[fg=#c4a7e7 bold]#{=/8/…:window_name}#[nobold]"
%hidden AGENT_NAME_STYLE="#{?#{&&:#{window_active},#{pane_active}},#[fg=#e0def4 bold],#[fg=#e0def4]}"

%hidden AGENT_ICON="#{?#{==:#{@agent_state},working},$AGENT_WORKING,#{?#{==:#{@agent_state},waiting},$AGENT_WAITING,#{?#{==:#{@agent_state},done},$AGENT_DONE,$AGENT_IDLE}}}"
# Each responsive tier needs its own pane loop so the agent count is evaluated
# once outside the loop. Every agent remains a mouse range named after its pane.
%hidden AGENT_PANE_24="#{?$AGENT_VISIBLE,#[range=user|#{pane_id}]$AGENT_ICON $AGENT_NAME_STYLE$AGENT_LABEL_24#[nobold]#[norange]#[fg=#524f67] · ,}"
%hidden AGENT_PANE_16="#{?$AGENT_VISIBLE,#[range=user|#{pane_id}]$AGENT_ICON $AGENT_NAME_STYLE$AGENT_LABEL_16#[nobold]#[norange]#[fg=#524f67] · ,}"
%hidden AGENT_PANE_12="#{?$AGENT_VISIBLE,#[range=user|#{pane_id}]$AGENT_ICON $AGENT_NAME_STYLE$AGENT_LABEL_12#[nobold]#[norange]#[fg=#524f67] · ,}"
%hidden AGENT_PANE_8="#{?$AGENT_VISIBLE,#[range=user|#{pane_id}]$AGENT_ICON $AGENT_NAME_STYLE$AGENT_LABEL_8#[nobold]#[norange]#[fg=#524f67] · ,}"
# A subtle dot separates agents in one window; the stronger bar separates
# windows. Strip the final separator at both levels.
%hidden AGENT_GROUP_24="#{?#{P:$AGENT_VISIBLE},$AGENT_WINDOW #{s/ · \$//:#{P:$AGENT_PANE_24}}#[fg=#524f67] │ ,}"
%hidden AGENT_GROUP_16="#{?#{P:$AGENT_VISIBLE},$AGENT_WINDOW #{s/ · \$//:#{P:$AGENT_PANE_16}}#[fg=#524f67] │ ,}"
%hidden AGENT_GROUP_12="#{?#{P:$AGENT_VISIBLE},$AGENT_WINDOW #{s/ · \$//:#{P:$AGENT_PANE_12}}#[fg=#524f67] │ ,}"
%hidden AGENT_GROUP_8="#{?#{P:$AGENT_VISIBLE},$AGENT_WINDOW #{s/ · \$//:#{P:$AGENT_PANE_8}}#[fg=#524f67] │ ,}"
%hidden AGENT_STATUS_24="#{s/ │ \$//:#{W:$AGENT_GROUP_24}}"
%hidden AGENT_STATUS_16="#{s/ │ \$//:#{W:$AGENT_GROUP_16}}"
%hidden AGENT_STATUS_12="#{s/ │ \$//:#{W:$AGENT_GROUP_12}}"
%hidden AGENT_STATUS_8="#{s/ │ \$//:#{W:$AGENT_GROUP_8}}"

set -g @agent_status "#{?#{e|>=|:$AGENT_BAR_WIDTH,#{e|*|:#{@agent_count},45}},$AGENT_STATUS_24,#{?#{e|>=|:$AGENT_BAR_WIDTH,#{e|*|:#{@agent_count},34}},$AGENT_STATUS_16,#{?#{e|>=|:$AGENT_BAR_WIDTH,#{e|*|:#{@agent_count},26}},$AGENT_STATUS_12,$AGENT_STATUS_8}}}#[fg=default]"
set -g @rose_pine_status_right_prepend_section "#{E:@agent_status}"

# Clicking an agent switches to its pane (with mouse on). tmux's own pane ranges
# only reach panes in the current window, hence user ranges; every other status
# click keeps tmux's default binding.
bind -n MouseDown1Status if -F "#{m:%*,#{mouse_status_range}}" { run -C "switch-client -t '#{mouse_status_range}'" } { switch-client -t = }

# "done" means finished but not yet seen: looking at the pane clears it.
set -g focus-events on
# Use a stable array index so this does not replace other pane-focus hooks.
set-hook -g pane-focus-in[100] 'if -F "#{&&:#{==:#{@agent_state},done},#{m:*focused*,#{client_flags}}}" "set -p @agent_state idle"'
