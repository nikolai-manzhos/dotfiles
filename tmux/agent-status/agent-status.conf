# Agent status: one "window:session glyph" entry per pane whose @agent_state is set
# by agent-state.sh (Claude Code hooks, opencode plugin). Panes back at a shell
# prompt are skipped, so an agent that exited without cleaning up disappears.
# Colours are rose-pine; style blocks must not contain commas.

%hidden AGENT_WORKING="#[fg=#f6c177]●"
%hidden AGENT_WAITING="#[fg=#eb6f92]✋"
%hidden AGENT_DONE="#[fg=#9ccfd8]✓"
%hidden AGENT_IDLE="#[fg=#6e6a86]○"

# The session name comes from the terminal title the agent sets ("✳ name" for
# Claude Code, "OC | name" for opencode); before a session is named, the pane
# number is shown instead. Names are cut at 20 characters.
%hidden AGENT_TITLE="#{s/^(OC [|] |[^A-Za-z0-9 ]+ )//:pane_title}"
%hidden AGENT_LABEL="#{?#{m/r:^(Claude Code|OpenCode)?$,$AGENT_TITLE},#{pane_index},$AGENT_TITLE}"

%hidden AGENT_ICON="#{?#{==:#{@agent_state},working},$AGENT_WORKING,#{?#{==:#{@agent_state},waiting},$AGENT_WAITING,#{?#{==:#{@agent_state},done},$AGENT_DONE,$AGENT_IDLE}}}"
%hidden AGENT_ENTRY="#{?#{@agent_state},#{?#{m:*sh,#{pane_current_command}},,#[fg=#908caa]#{window_name}:#{=/20/…:$AGENT_LABEL} $AGENT_ICON },}"

set -g @agent_status "#{W:#{P:$AGENT_ENTRY}}#[fg=default]"
set -g @rose_pine_status_right_prepend_section "#{E:@agent_status}"

# "done" means finished but not yet seen: looking at the pane clears it.
set -g focus-events on
set-hook -g pane-focus-in 'if -F "#{==:#{@agent_state},done}" "set -p @agent_state idle"'
